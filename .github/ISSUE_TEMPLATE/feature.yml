name: Feature request / 功能建议
description: Describe a real integration need, alternatives and completion criteria.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        中文和 English 均可。请先查看 [路线图](https://github.com/givingwu/fs-router/blob/main/ROADMAP.md) 和 [支持范围](https://github.com/givingwu/fs-router/blob/main/SUPPORT.md)。
        不需要承诺实现；请使用虚构场景，不包含公司品牌或内部资料。遵守 [Code of Conduct](https://github.com/givingwu/fs-router/blob/main/CODE_OF_CONDUCT.md)。
  - type: textarea
    id: problem
    attributes:
      label: Use case and current obstacle / 使用场景与阻碍
      description: What are you trying to do in an existing React app? Include relevant router/bundler versions and the current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior and acceptance / 期望行为与验收
      description: Give a small before/after example and a result we could verify. A problem statement is welcome even without an API design.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility / 替代方案与兼容影响（可选）
      description: Could manual React Router routes solve this? Note migration costs, default changes, types, SSR or deployment needs if relevant.
