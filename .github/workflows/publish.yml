name: Package preview and publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package.json version to preview (e.g. 0.1.0)'
        required: true
        type: string
      publish:
        description: 'Publish the verified tarball to npm (requires administrator setup and approval)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Check requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm typecheck && pnpm test
      - run: pnpm check:consumers
      - run: pnpm docs:build && pnpm docs:check
      - name: Preview publication without uploading
        run: npm publish ./.artifacts/feoe-fs-router-*.tgz --dry-run --ignore-scripts --access public
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.run_id }}
          path: |
            .artifacts/*.tgz
            .artifacts/package-preview.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: preview
    if: inputs.publish && github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.run_id }}
          path: package-preview
      - name: Verify and publish exactly the previewed bytes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        working-directory: package-preview
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const preview = JSON.parse(readFileSync('package-preview.json', 'utf8'));
          assert.equal(preview.name, '@feoe/fs-router');
          assert.equal(preview.version, process.env.RELEASE_VERSION);
          assert.equal(preview.filename, `feoe-fs-router-${preview.version}.tgz`);
          const integrity = `sha512-${createHash('sha512').update(readFileSync(preview.filename)).digest('base64')}`;
          assert.equal(integrity, preview.integrity);
          execFileSync('npm', ['publish', `./${preview.filename}`, '--ignore-scripts', '--access', 'public', '--provenance', '--tag', preview.version.includes('-') ? 'next' : 'latest'], {stdio: 'inherit'});
          NODE
